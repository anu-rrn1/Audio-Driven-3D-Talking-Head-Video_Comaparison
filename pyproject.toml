[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypt"
version = "0.2.0"
description = "Audio-driven 3D talking heads from a face mesh, a few photos and speech"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["tinypt*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]  # single-letter geometry names (I, l) are conventional here
